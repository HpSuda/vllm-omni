version: 1
name: wan22-2xusp4-n50-rps005-seed42-calibrated

simulation:
  seed: 42
  runs: 1

workload:
  num_requests: 50
  utilization: null
  request_rate: 0.05
  request_types:
    - name: short
      weight: 0.15
      width: 854
      height: 480
      num_inference_steps: 3
      num_frames: 80
      # Mean of four serial E2E measurements on one USP4 backend.
      nominal_service_s: 46.461192143149674
      # Estimator value visible to the production scheduling policy.
      estimated_service_s: 38.07
      metadata:
        fps: 16
    - name: medium
      weight: 0.25
      width: 854
      height: 480
      num_inference_steps: 4
      num_frames: 120
      nominal_service_s: 86.86919855233282
      estimated_service_s: 71.34
      metadata:
        fps: 24
    - name: long
      weight: 0.60
      width: 1280
      height: 720
      num_inference_steps: 6
      num_frames: 80
      nominal_service_s: 188.72025074996054
      estimated_service_s: 119.71
      metadata:
        fps: 16

service:
  timing_model:
    type: fixed_anchor
  encode_fraction: 0.0
  decode_fraction: 0.0
  actual_jitter_sigma: 0.0
  estimate_error_sigma: 0.0
  preemption_cost_s: 0.0
  # Joint residual fit against the 50/100-request NPU P95 measurements:
  # 2185.56s and 2968.99s. One topology-level scale predicts both within 0.06%.
  actual_service_scale: 0.958
  hsdp:
    enabled: false
    shard_size: 1
    communication_overhead_weight: 0.0

topology:
  name: wan22-2xusp4-measured-service
  backend_count: 2
  devices_per_backend: 4
  speed_factors: [1.0, 1.0]

# Original super_p95_step policy. The benchmark performs one unmeasured warmup
# request, so its persistent classifier state is represented explicitly.
policy:
  classifier:
    type: quota_tail
    quota_every: 20
    quota_amount: 1
    threshold_ratio: 0.8
    long_request_ratio: 1.5
    initial_arrival_counter: 1
    initial_credits: 0
    initial_min_service_s: 0.499921875
    initial_max_service_s: 0.499921875
  router:
    type: weighted_least_load
    sacrificial_load_factor: 0.1
    load_view: assigned
    update_latency_ema: false
  scheduler:
    type: two_queue
    normal_order: fifo
    sacrificial_order: lifo
    preempt_normal_over_sacrificial: true
