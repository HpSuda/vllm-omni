# This preserves the original online Tail credit/classification behavior. The
# only candidate change is deferred Normal binding and its pull order. Neither
# component reads workload.num_requests, future arrivals, or actual service.
policy:
  classifier:
    type: quota_tail
    quota_every: 20
    quota_amount: 1
    threshold_ratio: 0.8
    long_request_ratio: 1.5
    initial_arrival_counter: 1
    initial_credits: 0
    initial_min_service_s: 0.499921875
    initial_max_service_s: 0.499921875
  router:
    type: weighted_least_load
    sacrificial_load_factor: 0.1
    load_view: assigned
    update_latency_ema: false
  scheduler:
    type: two_queue
    normal_order: fifo
    sacrificial_order: lifo
    preempt_normal_over_sacrificial: true
    global_work_stealing: false
    steal_order: max_risk
    steal_hysteresis_s: 10.0
    steal_cost_s: 0.5
    global_protected_pull: true
    protected_pull_order: cost_damped_risk
    protected_pull_risk_beta: 0.5
    protected_pull_cost_s: 0.5
