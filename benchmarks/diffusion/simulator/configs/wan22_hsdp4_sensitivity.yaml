version: 1
name: wan22-2xusp4-hsdp4-sensitivity

simulation:
  seed: 42
  runs: 1

workload:
  num_requests: 100
  utilization: null
  request_rate: 0.05
  request_types:
    - name: short
      weight: 0.15
      width: 854
      height: 480
      num_inference_steps: 3
      num_frames: 80
      nominal_service_s: 38.07
      estimated_service_s: 38.07
      metadata: {fps: 16}
    - name: medium
      weight: 0.25
      width: 854
      height: 480
      num_inference_steps: 4
      num_frames: 120
      nominal_service_s: 71.34
      estimated_service_s: 71.34
      metadata: {fps: 24}
    - name: long
      weight: 0.60
      width: 1280
      height: 720
      num_inference_steps: 6
      num_frames: 80
      nominal_service_s: 119.71
      estimated_service_s: 119.71
      metadata: {fps: 16}

service:
  encode_fraction: 0.0
  decode_fraction: 0.0
  actual_jitter_sigma: 0.0
  estimate_error_sigma: 0.0
  preemption_cost_s: 0.0
  # Back-calibrated from the old 2 x USP4 aggregate QPS. It is a prior, not
  # a measurement of resident USP4 compute.
  actual_service_scale: 1.335708624
  hsdp:
    enabled: true
    shard_size: 4
    # Initial assumption: HSDP communication costs 25% of denoise compute.
    communication_overhead_weight: 0.25

topology:
  name: wan22-2xusp4-hsdp4-sensitivity
  backend_count: 2
  devices_per_backend: 4
  speed_factors: [1.0, 1.0]

policy:
  classifier:
    type: quota_tail
    quota_every: 20
    quota_amount: 1
    threshold_ratio: 0.8
    long_request_ratio: 1.5
    initial_arrival_counter: 0
    initial_credits: 0
    initial_min_service_s: null
    initial_max_service_s: 0.0
  router:
    type: weighted_least_load
    sacrificial_load_factor: 0.1
    load_view: assigned
    update_latency_ema: false
  scheduler:
    type: two_queue
    normal_order: fifo
    sacrificial_order: lifo
    preempt_normal_over_sacrificial: true
