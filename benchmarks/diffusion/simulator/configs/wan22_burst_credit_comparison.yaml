version: 1
name: wan22-burst-credit-comparison
seed: 2162
runs: 400
baseline: M8 All-Normal

scenarios:
  - name: 50 requests / 0.05 rps / 2xUSP4
    overrides:
      - workload.num_requests=50
      - workload.utilization=null
      - workload.request_rate=0.05
      - service.preemption_cost_s=2.0
      - service.hsdp.shard_size=4
      - service.timing_model.execution.usp_degree=4
      - topology.name=wan22-2xusp4-burst-credit
      - topology.backend_count=2
      - topology.devices_per_backend=4
      - topology.speed_factors=[1.0,1.0]
  - name: 50 requests / 0.05 rps / 4xUSP2
    overrides:
      - workload.num_requests=50
      - workload.utilization=null
      - workload.request_rate=0.05
      - service.preemption_cost_s=2.0
      - service.hsdp.shard_size=2
      - service.timing_model.execution.usp_degree=2
      - topology.name=wan22-4xusp2-burst-credit
      - topology.backend_count=4
      - topology.devices_per_backend=2
      - topology.speed_factors=[1.0,1.0,1.0,1.0]
  - name: 100 requests / 0.03 rps / 2xUSP4
    overrides:
      - workload.num_requests=100
      - workload.utilization=null
      - workload.request_rate=0.03
      - service.preemption_cost_s=2.0
      - service.hsdp.shard_size=4
      - service.timing_model.execution.usp_degree=4
      - topology.name=wan22-2xusp4-burst-credit
      - topology.backend_count=2
      - topology.devices_per_backend=4
      - topology.speed_factors=[1.0,1.0]
  - name: 100 requests / 0.03 rps / 4xUSP2
    overrides:
      - workload.num_requests=100
      - workload.utilization=null
      - workload.request_rate=0.03
      - service.preemption_cost_s=2.0
      - service.hsdp.shard_size=2
      - service.timing_model.execution.usp_degree=2
      - topology.name=wan22-4xusp2-burst-credit
      - topology.backend_count=4
      - topology.devices_per_backend=2
      - topology.speed_factors=[1.0,1.0,1.0,1.0]

variants:
  - name: M8 All-Normal
    config: wan22_analytic_usp4.yaml
    overrides:
      - policy.classifier.max_sacrificial=0
      - service.hsdp.shard_size=8
      - service.timing_model.execution.usp_degree=8
      - topology.name=wan22-1xusp8-analytic
      - topology.backend_count=1
      - topology.devices_per_backend=8
      - topology.speed_factors=[1.0]
  - name: Staggered Single Credit + PECT-Remaining + Tail-Pack + FIFO
    config: wan22_centered_cohort_pect_pack_steal_50.yaml
    overrides:
      - policy.classifier.quota_amount=1
      - policy.classifier.credit_release_requests=[20,40,60,80]
      - policy.classifier.max_sacrificial=4
      - policy.scheduler.global_work_stealing=false
  - name: Burst Double Credit + PECT-Remaining + Tail-Pack + FIFO
    config: wan22_centered_cohort_pect_pack_steal_50.yaml
    overrides:
      - policy.classifier.quota_amount=2
      - policy.classifier.credit_release_requests=[25,75]
      - policy.classifier.max_sacrificial=4
      - policy.scheduler.global_work_stealing=false
  - name: Staggered Single Credit + Tail-Pack + Max-Risk Central Pull + FIFO
    config: wan22_centered_cohort_pect_pack_steal_50.yaml
    overrides:
      - policy.classifier.quota_amount=1
      - policy.classifier.credit_release_requests=[20,40,60,80]
      - policy.classifier.max_sacrificial=4
      - policy.scheduler.global_work_stealing=false
      - policy.scheduler.global_protected_pull=true
      - policy.scheduler.protected_pull_order=max_risk
      - policy.scheduler.protected_pull_cost_s=0.5
  - name: Burst Double Credit + Tail-Pack + Max-Risk Central Pull + FIFO
    config: wan22_centered_cohort_pect_pack_steal_50.yaml
    overrides:
      - policy.classifier.quota_amount=2
      - policy.classifier.credit_release_requests=[25,75]
      - policy.classifier.max_sacrificial=4
      - policy.scheduler.global_work_stealing=false
      - policy.scheduler.global_protected_pull=true
      - policy.scheduler.protected_pull_order=max_risk
      - policy.scheduler.protected_pull_cost_s=0.5
