version: 1
name: wan22-4xusp2-hsdp2-sensitivity

simulation:
  seed: 42
  runs: 1

workload:
  num_requests: 100
  utilization: null
  request_rate: 0.05
  request_types:
    - name: short
      weight: 0.15
      width: 854
      height: 480
      num_inference_steps: 3
      num_frames: 80
      nominal_service_s: 38.07
      estimated_service_s: 38.07
