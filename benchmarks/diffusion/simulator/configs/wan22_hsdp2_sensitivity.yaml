    - name: long
      weight: 0.60
      width: 1280
      height: 720
      num_inference_steps: 6
      num_frames: 80
      nominal_service_s: 119.71
      estimated_service_s: 119.71
      metadata: {fps: 16}

service:
  encode_fraction: 0.0
  decode_fraction: 0.0
  actual_jitter_sigma: 0.0
  estimate_error_sigma: 0.0
  preemption_cost_s: 0.0
  # H4 prior multiplied by the old USP8-to-USP4 per-backend penalty. H2 has
  # no direct measurement yet, so this value is deliberately theoretical.
  actual_service_scale: 2.297078525
  hsdp:
    enabled: true
    shard_size: 2
    communication_overhead_weight: 0.25

topology:
  name: wan22-4xusp2-hsdp2-sensitivity
  backend_count: 4
  devices_per_backend: 2
  speed_factors: [1.0, 1.0, 1.0, 1.0]

policy:
  classifier:
    type: quota_tail
    quota_every: 20
    quota_amount: 1
    threshold_ratio: 0.8
    long_request_ratio: 1.5
    initial_arrival_counter: 0
    initial_credits: 0
    initial_min_service_s: null
    initial_max_service_s: 0.0
  router:
    type: weighted_least_load
    sacrificial_load_factor: 0.1
    load_view: assigned
    update_latency_ema: false
  scheduler:
    type: two_queue
    normal_order: fifo
    sacrificial_order: lifo
    preempt_normal_over_sacrificial: true
