# This policy receives exactly the same online estimates and queue state as the
# original policy. It does not inspect request_type_name, workload size, future
# arrivals, or actual service duration.
policy:
  classifier:
    type: quota_tail
    quota_every: 20
    quota_amount: 1
    threshold_ratio: 0.8
    long_request_ratio: 1.5
    initial_arrival_counter: 1
    initial_credits: 0
    initial_min_service_s: 0.499921875
    initial_max_service_s: 0.499921875
  router:
    type: projected_completion
    nonpreemptible_weight: 0.1
    tail_mode: spread
    load_view: assigned
    update_latency_ema: false
  scheduler:
    type: two_queue
    normal_order: fifo
    sacrificial_order: lifo
    preempt_normal_over_sacrificial: true
    global_work_stealing: false
    steal_order: max_risk
    steal_hysteresis_s: 10.0
    steal_cost_s: 0.5
    global_protected_pull: false
    protected_pull_order: max_risk
    protected_pull_cost_s: 0.5
